<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إرسال مساهمة | أصداء+</title><link rel="stylesheet" href="style.css"></head><body><main><a href="index.html">العودة إلى المجلة</a><h1>إرسال مساهمة</h1><p>تُعرض المساهمات على هيئة التحرير للمراجعة قبل النشر.</p><form id="contributionForm"><label>الاسم الكامل<input name="author" required></label><label>البريد الإلكتروني<input name="email" type="email" required></label><label>عنوان المساهمة<input name="title" required></label><label>القسم<select name="category"><option>الممارسات البيداغوجية</option><option>الموارد التعليمية</option><option>الحياة المدرسية</option><option>التربية الرقمية</option><option>الدراسات والبحوث</option><option>الثقافة والإبداع</option></select></label><label>النص<textarea name="body" rows="9" required></textarea></label><label>مرفق اختياري<input name="attachment" type="file"></label><button>إرسال للمراجعة</button><p id="status"></p></form></main><script src="config.js"></script><script src="contribute.js"></script></body></html>
